name: polyui_example
description: Replays a bills conversation through the PolyUI Flutter renderer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  polyui:
    path: ..
  speech_to_text: ^7.4.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/conversation.json
    - assets/weather.json
    - assets/forecast-app.html
