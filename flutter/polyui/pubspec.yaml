name: polyui
description: Flutter renderer for PolyUI surfaces, drawn through the Rust client core over dart:ffi.
version: 0.1.8
homepage: https://murtazox04.github.io/polyui/
repository: https://github.com/murtazox04/polyui/tree/main/flutter/polyui
issue_tracker: https://github.com/murtazox04/polyui/issues
topics:
  - generative-ui
  - llm
  - agents
  - mcp
  - ffi

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^1.0.0
  meta: ^1.16.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  webview_flutter_platform_interface: ^2.15.1
