name: polyui
description: Flutter renderer for PolyUI surfaces, drawn through the Rust client core over dart:ffi.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^1.0.0
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
