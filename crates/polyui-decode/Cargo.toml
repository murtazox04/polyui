[package]
name = "polyui-decode"
description = "Grammar-constrained decoding for PolyUI tool calls on local models, built on llguidance."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "polyui-decode"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
polyui-core = { workspace = true }
serde_json = { workspace = true }
llguidance = { version = "1.9.1", default-features = false, features = ["lark"] }
clap = { version = "4.6.9", features = ["derive"], optional = true }
