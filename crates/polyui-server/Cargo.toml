[package]
name = "polyui-server"
description = "Reference PolyUI server: the agent loop, Anthropic provider, WebSocket and SSE transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
polyui-core = { workspace = true }
polyui-chart = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "json"] }
futures-util = "0.3.34"
tokio-stream = { version = "0.1.19", features = ["sync"] }
getrandom = "0.4.3"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
