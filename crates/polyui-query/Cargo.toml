[package]
name = "polyui-query"
description = "Read-only SQL over whitelisted CSV and Parquet files for PolyUI dashboards, built on DataFusion."
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
datafusion = { version = "56.0.0", default-features = false, features = ["sql", "parquet", "datetime_expressions", "string_expressions", "unicode_expressions"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
