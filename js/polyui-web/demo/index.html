<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src 'self' ws:; require-trusted-types-for 'script'; trusted-types 'none'" />
    <title>PolyUI web renderer</title>
    <link rel="stylesheet" href="../dist/polyui.css" />
    <style>
      :root {
        color-scheme: var(--pui-scheme);
        --pui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        --pui-series-bar: light-dark(oklch(86% 0.035 196), oklch(38% 0.035 196));
        --demo-canvas: light-dark(oklch(96.4% 0.006 85), oklch(15.5% 0.006 265));
        --demo-bubble: light-dark(oklch(91.5% 0.012 196), oklch(28% 0.02 196));
        --demo-panel: light-dark(oklch(98.4% 0.004 85), oklch(19% 0.006 265));
        --demo-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--demo-canvas);
        color: var(--pui-fg);
        font-family: var(--pui-font);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--pui-accent-soft);
      }

      .bar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px clamp(16px, 4vw, 32px);
        background: color-mix(in oklch, var(--demo-canvas) 86%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--pui-border);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 auto 0 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .mark svg {
        width: 22px;
        height: 22px;
      }

      .mark small {
        color: var(--pui-fg-muted);
        font-size: 13px;
        font-weight: 500;
      }

      .tool {
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid var(--pui-border);
        border-radius: 9px;
        background: var(--pui-bg);
        color: var(--pui-fg);
        font: inherit;
        font-size: 13px;
        font-weight: 550;
        cursor: pointer;
      }

      .tool:hover {
        border-color: var(--pui-border-strong);
      }

      .tool:focus-visible {
        outline: 2px solid var(--pui-focus);
        outline-offset: 2px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 640px);
        justify-content: center;
        gap: 32px;
        padding: clamp(20px, 5vw, 48px) clamp(14px, 4vw, 32px) 96px;
      }

      @media (min-width: 1080px) {
        .layout {
          grid-template-columns: minmax(0, 640px) 340px;
        }
      }

      .thread {
        display: grid;
        gap: 22px;
        align-content: start;
      }

      .user {
        justify-self: end;
        max-width: 80%;
        margin: 0;
        padding: 10px 14px;
        border-radius: 18px 18px 6px 18px;
        background: var(--demo-bubble);
      }

      .assistant {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 12px;
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--pui-accent);
        color: var(--pui-accent-fg);
      }

      .avatar svg {
        width: 16px;
        height: 16px;
      }

      .reply {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .reply > p {
        margin: 3px 0 0;
      }

      .spoken {
        min-height: 1.5em;
        margin: 0;
        color: var(--pui-fg-muted);
        font-size: 13px;
      }

      .panel {
        align-self: start;
        position: sticky;
        top: 84px;
        display: grid;
        gap: 12px;
        padding: 18px;
        border: 1px solid var(--pui-border);
        border-radius: 16px;
        background: var(--demo-panel);
      }

      .panel h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
      }

      .panel p {
        margin: 0;
        color: var(--pui-fg-muted);
        font-size: 13px;
      }

      .wire {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .wire:empty::after {
        content: "Nothing sent yet.";
        color: var(--pui-fg-muted);
        font-size: 13px;
      }

      .wire-item {
        display: grid;
        gap: 2px;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--pui-bg);
        border: 1px solid var(--pui-border);
        animation: wire-in 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .wire-head {
        font-size: 12px;
        font-weight: 600;
      }

      .wire-send .wire-head {
        color: var(--pui-accent);
      }

      .wire-body {
        overflow-wrap: anywhere;
        color: var(--pui-fg-muted);
        font-family: var(--demo-mono);
        font-size: 11.5px;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @keyframes wire-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }

      @media (max-width: 1079px) {
        .panel {
          position: static;
        }
      }

      .tool {
        white-space: nowrap;
      }

      @media (max-width: 560px) {
        .bar {
          gap: 8px;
        }

        .mark small {
          display: none;
        }

        .bar {
          padding-inline: 12px;
        }

        .tool {
          padding: 0 8px;
          font-size: 12.5px;
        }

        .assistant {
          grid-template-columns: minmax(0, 1fr);
        }

        .user {
          max-width: 92%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wire-item {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <p class="mark">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2" /><rect x="13" y="3" width="8" height="8" rx="4" /><rect x="3" y="13" width="18" height="8" rx="2" /></svg>
        PolyUI <small>web renderer</small>
      </p>
      <button class="tool" id="read" type="button">Read aloud</button>
      <button class="tool" id="theme" type="button">Theme: System</button>
      <button class="tool" id="replay" type="button">Replay</button>
    </header>
    <main class="layout">
      <section class="thread" aria-label="Conversation">
        <p class="user">How much do I owe for utilities this month? I'd like to pay the gas and power bills.</p>
        <div class="assistant">
          <span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5" /></svg></span>
          <div class="reply">
            <p>Here is November. Heating pushed the gas bill up, so the total is higher than October.</p>
            <div id="stage"></div>
            <p class="spoken" id="spoken" aria-live="polite"></p>
          </div>
        </div>
      </section>
      <aside class="panel" aria-label="Protocol traffic">
        <h2>On the wire</h2>
        <p>Messages the renderer sends back, and what the scripted server answers.</p>
        <ol class="wire" id="wire"></ol>
      </aside>
    </main>
    <script type="module" src="../dist/demo.js"></script>
  </body>
</html>
