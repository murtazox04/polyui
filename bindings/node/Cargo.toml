[package]
name = "polyui-node"
description = "Node bindings for the PolyUI core: validation, tool schemas, charts and the client core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "polyui_node"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
polyui-core = { workspace = true }
polyui-chart = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
getrandom = "0.4.3"

[build-dependencies]
napi-build = "2"
