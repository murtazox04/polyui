name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - bindings/python/pyproject.toml
      - bindings/node/package.json
      - js/polyui-web/package.json
      - flutter/polyui/pubspec.yaml
      - android/polyui/build.gradle.kts
      - android/gradle.properties

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.event_name == 'push' }}
  BINARYEN_VERSION: "133"

jobs:
  version:
    name: Check the version and the prepared release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version and check every manifest carries it
        id: version
        run: |
          if [ "$PUBLISH" = true ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          fi
          bash scripts/release/check-versions.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the draft release from Prepare release
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f Package.swift || { echo "Package.swift is missing: tag the commit that Prepare release pushed" >&2; exit 1; }
          draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"
          test "$draft" = true || { echo "v$VERSION has no draft release: run Prepare release first" >&2; exit 1; }
          target="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v$VERSION\") | .target_commitish")"
          test "$target" = "$GITHUB_SHA" || { echo "v$VERSION points at $GITHUB_SHA but the draft was prepared for $target" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/draft"
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/draft"
          (cd "$RUNNER_TEMP/draft" && sha256sum --check SHA256SUMS)
          bash scripts/release/check-pins.sh "$VERSION" "$RUNNER_TEMP/draft"

  cli:
    name: polyui CLI for ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Build polyui
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked -p polyui --target "$TARGET"
      - name: Check the binary runs
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          binary="target/$TARGET/release/polyui"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary" --version
      - name: Pack the archive
        run: |
          name="polyui-$VERSION-$TARGET"
          mkdir -p "$name" out
          cp LICENSE README.md "$name/"
          if [ -f "target/$TARGET/release/polyui.exe" ]; then
            cp "target/$TARGET/release/polyui.exe" "$name/"
            7z a -tzip "out/$name.zip" "$name" >/dev/null
          else
            cp "target/$TARGET/release/polyui" "$name/"
            tar -czf "out/$name.tar.gz" "$name"
          fi
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  wheels:
    name: Python wheel for ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: auto
            test: true
          - name: manylinux aarch64
            runner: ubuntu-24.04
            target: aarch64
            manylinux: auto
          - name: musllinux x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: musllinux_1_2
          - name: musllinux aarch64
            runner: ubuntu-24.04
            target: aarch64
            manylinux: musllinux_1_2
          - name: macOS arm64
            runner: macos-26
            target: aarch64
            test: true
          - name: macOS x86_64
            runner: macos-26
            target: x86_64
          - name: Windows x64
            runner: windows-2025
            target: x64
            test: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Install the wheel and run the Python tests
        if: matrix.test
        shell: bash
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl
          python -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist/
          if-no-files-found: error

  sdist:
    name: Python source distribution
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: bindings/python/dist/
          if-no-files-found: error

  node:
    name: Node addon for ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            flags: --use-napi-cross
            test: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            flags: --use-napi-cross
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            flags: --cross-compile
            zig: true
          - target: aarch64-apple-darwin
            runner: macos-26
            test: true
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            test: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - uses: mlugg/setup-zig@v2.2.1
        if: matrix.zig
      - run: npm ci
      - name: Build the addon
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: npx napi build --platform --release --strip --no-js --dts native.d.ts --target "${{ matrix.target }}" ${{ matrix.flags }}
      - name: Run the Node tests
        if: matrix.test
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  web:
    name: Web renderer package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install the wasm-bindgen CLI pinned in bindings/wasm/Cargo.toml
        run: |
          version=$(grep -oP 'wasm-bindgen = "=\K[0-9.]+' bindings/wasm/Cargo.toml)
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Install binaryen
        run: |
          curl -sSfL -o binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -sSfL -o binaryen.tar.gz.sha256 "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz.sha256"
          echo "$(cut -d' ' -f1 binaryen.tar.gz.sha256)  binaryen.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf binaryen.tar.gz -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/polyui-web/package-lock.json
      - name: Build the wasm core and the renderer, then pack it
        run: |
          node bindings/wasm/build.mjs
          cd js/polyui-web
          npm ci
          npm test
          mkdir -p "$GITHUB_WORKSPACE/out"
          npm pack --pack-destination "$GITHUB_WORKSPACE/out"
          tar -tzf "$GITHUB_WORKSPACE"/out/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: out/
          if-no-files-found: error

  crates-check:
    name: crates.io dry run
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Package and build every crate the way crates.io will
        run: cargo publish --workspace --dry-run --locked

  dart-check:
    name: pub.dev dry run
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: Validate the package the way pub.dev will
        working-directory: flutter/polyui
        run: flutter pub publish --dry-run

  android-check:
    name: Maven package dry run
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install the NDK, the Android targets and cargo-ndk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the AAR and the POM into a local repository
        working-directory: android
        run: |
          ./gradlew --no-configuration-cache :polyui:publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/m2"
          find "$RUNNER_TEMP/m2/io/github/murtazox04" -type f | sort
          unzip -l "$RUNNER_TEMP"/m2/io/github/murtazox04/polyui-android/*/polyui-android-*.aar | grep 'jni/'

  github-release:
    name: Publish the GitHub release
    if: github.event_name == 'push'
    needs: [version, cli, wheels, sdist, node, web, crates-check, dart-check, android-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: cli/*
      - name: Add the CLI archives and publish the draft
        run: |
          mkdir -p "$RUNNER_TEMP/draft"
          gh release download "v$VERSION" --pattern SHA256SUMS --dir "$RUNNER_TEMP/draft"
          (cd cli && sha256sum -- *) >> "$RUNNER_TEMP/draft/SHA256SUMS"
          gh release upload "v$VERSION" cli/* --clobber
          gh release upload "v$VERSION" "$RUNNER_TEMP/draft/SHA256SUMS" --clobber
          gh release edit "v$VERSION" --draft=false --latest

  crates:
    name: Publish to crates.io
    if: github.event_name == 'push' && contains(vars.RELEASE_REGISTRIES, 'crates')
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
        if: env.HAS_TOKEN != 'true'
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh "$VERSION"

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && contains(vars.RELEASE_REGISTRIES, 'pypi')
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/polyui
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true

  npm:
    name: Publish to npm
    if: github.event_name == 'push' && contains(vars.RELEASE_REGISTRIES, 'npm')
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: bindings/node/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web
      - name: Publish the platform packages, then @polyui/node
        working-directory: bindings/node
        run: |
          npm ci
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts --npm-dir npm
          npx napi pre-publish -t npm --no-gh-release
          npm publish --access public
      - name: Publish @polyui/web
        run: npm publish web/*.tgz --access public

  maven:
    name: Publish to Maven Central
    if: github.event_name == 'push' && contains(vars.RELEASE_REGISTRIES, 'maven')
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install the NDK, the Android targets and cargo-ndk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build, sign and release polyui-android
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :polyui:publishToMavenCentral

  pub:
    name: Publish to pub.dev
    if: github.event_name == 'push' && contains(vars.RELEASE_REGISTRIES, 'pub')
    needs: [version, github-release]
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
      working-directory: flutter/polyui
