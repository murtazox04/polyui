[workspace]
resolver = "3"
members = [
    "crates/polyui-core",
    "crates/polyui-chart",
    "crates/polyui-server",
    "crates/polyui-cli",
    "crates/polyui-query",
    "crates/polyui-decode",
    "bindings/wasm",
    "bindings/python",
    "bindings/node",
    "bindings/ffi",
    "bench",
]
default-members = [
    "crates/polyui-core",
    "crates/polyui-chart",
    "crates/polyui-server",
    "crates/polyui-cli",
    "crates/polyui-query",
    "crates/polyui-decode",
    "bindings/wasm",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/murtazox04/polyui"
authors = ["Murtazo Xurramov"]

[workspace.dependencies]
polyui-core = { path = "crates/polyui-core", version = "0.1.0" }
polyui-chart = { path = "crates/polyui-chart", version = "0.1.0" }
polyui-server = { path = "crates/polyui-server", version = "0.1.0" }
polyui-query = { path = "crates/polyui-query", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
